<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes pulseRing {
        0% { r: 3px; opacity: 0.9; }
        50% { r: 6.5px; opacity: 0; }
        100% { r: 3px; opacity: 0; }
      }
      @keyframes beaconCore {
        0%, 100% { opacity: 1; fill: #ff471a; }
        50% { opacity: 0.6; fill: #ffa31a; }
      }
      .beacon-wave {
        animation: pulseRing 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        transform-origin: 32px 10px;
      }
      .beacon-dot {
        animation: beaconCore 1.8s ease-in-out infinite;
      }
      @media (prefers-color-scheme: dark) {
        .badge-bg { fill: #1c262b; stroke: #d97736; stroke-width: 2.5; }
        .badge-shadow { fill: #0a0f12; }
        .grid-line { stroke: rgba(217, 119, 54, 0.18); }
        .beam-metal { fill: #d97736; }
        .beam-flange { fill: #ff8a3d; }
        .monogram { fill: #fbf9f3; }
        .hardhat-body { fill: #f5f2eb; stroke: #0a0f12; }
      }
      @media (prefers-color-scheme: light) {
        .badge-bg { fill: #fbf9f3; stroke: #202c31; stroke-width: 2.5; }
        .badge-shadow { fill: #202c31; }
        .grid-line { stroke: rgba(32, 44, 49, 0.12); }
        .beam-metal { fill: #202c31; }
        .beam-flange { fill: #546066; }
        .monogram { fill: #ffffff; }
        .hardhat-body { fill: #ffffff; stroke: #202c31; }
      }
    </style>
  </defs>

  <!-- Neo-Brutalist Hard Shadow -->
  <rect class="badge-shadow" x="7" y="7" width="52" height="52" rx="14" fill="#202c31" />

  <!-- Main Neo-Brutalist Badge Container -->
  <rect class="badge-bg" x="4" y="4" width="52" height="52" rx="14" fill="#fbf9f3" stroke="#202c31" stroke-width="2.5" />

  <!-- Subtle Blueprint Grid Lines -->
  <line class="grid-line" x1="4" y1="20" x2="56" y2="20" stroke="#202c31" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="2 2" />
  <line class="grid-line" x1="4" y1="38" x2="56" y2="38" stroke="#202c31" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="2 2" />
  <line class="grid-line" x1="20" y1="4" x2="20" y2="56" stroke="#202c31" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="2 2" />
  <line class="grid-line" x1="44" y1="4" x2="44" y2="56" stroke="#202c31" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="2 2" />

  <!-- Civil Site Active Laser / Surveying Beacon -->
  <circle class="beacon-wave" cx="32" cy="11" r="3" fill="none" stroke="#d97736" stroke-width="1.5" />
  <circle class="beacon-dot" cx="32" cy="11" r="2.5" fill="#d97736" />

  <!-- Safety Hardhat Motif -->
  <!-- Top Ridge / Reinforcement Rib -->
  <path d="M30 11 L34 11 L34 18 L30 18 Z" fill="#d97736" stroke="#202c31" stroke-width="1" />

  <!-- Hardhat Dome Shell -->
  <path class="hardhat-body" d="M17 28 C17 18 23 13 32 13 C41 13 47 18 47 28 Z" fill="#ffffff" stroke="#202c31" stroke-width="2" stroke-linejoin="round" />

  <!-- Hardhat Shell Contour / Shading Accent -->
  <path d="M19 27 C20 20 25 15 32 15 C33.5 15 35 15.3 36.5 16 C30 17 22 21 19 27 Z" fill="#d97736" opacity="0.3" />

  <!-- Hardhat Safety Orange Center Band -->
  <path d="M29 13.5 L35 13.5 L35 28 L29 28 Z" fill="#d97736" />

  <!-- Hardhat Visor / Brim -->
  <path d="M13 28 C13 26.5 15 26.5 16 26.5 L48 26.5 C49 26.5 51 26.5 51 28 C51 30.5 48 31 32 31 C16 31 13 30.5 13 28 Z" fill="#d97736" stroke="#202c31" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Structural Steel Foundation / Reinforced I-Beam -->
  <g transform="translate(0, 0)">
    <!-- Top Flange Plate -->
    <rect class="beam-metal" x="11" y="36" width="42" height="4" rx="1.5" fill="#202c31" />
    
    <!-- Vertical Web -->
    <rect class="beam-metal" x="29" y="40" width="6" height="7" fill="#202c31" />

    <!-- Structural Wing Braces (Knee Braces) -->
    <path d="M16 40 L21 40 L29 44 L29 47 Z" fill="#546066" opacity="0.6" />
    <path d="M48 40 L43 40 L35 44 L35 47 Z" fill="#546066" opacity="0.6" />

    <!-- Bottom Flange / Ground Grade Beam -->
    <rect class="beam-metal" x="8" y="47" width="48" height="5" rx="1.5" fill="#202c31" />

    <!-- High-Tension Structural Rivets / Bolted Connections -->
    <circle cx="14" cy="38" r="1" fill="#fbf9f3" />
    <circle cx="50" cy="38" r="1" fill="#fbf9f3" />
    <circle cx="12" cy="49.5" r="1" fill="#d97736" />
    <circle cx="52" cy="49.5" r="1" fill="#d97736" />

    <!-- "AM" Civil Engineering Technical Monogram Stamped on Grade Beam -->
    <!-- Letter A -->
    <path d="M24 49.5 L26 43.5 L28 49.5 M24.8 47.5 L27.2 47.5" stroke="#fbf9f3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Letter M -->
    <path d="M36 49.5 L36 43.5 L38 46.5 L40 43.5 L40 49.5" stroke="#fbf9f3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>